name: Publicar web de reservas

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "apps-script/**"
      - "package.json"
      - "package-lock.json"
      - "web-reservas/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "apps-script/**"
      - "package.json"
      - "package-lock.json"
      - "web-reservas/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida el backend (proyecto principal) — la publicación en GitHub Pages
  # no debe ocurrir si esto falla, aunque este workflow solo publique
  # web-reservas/: el frontend depende del contrato de esta API pública.
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del proyecto principal
        run: npm ci

      - name: Lint del proyecto principal
        run: npm run lint

      - name: Typecheck del proyecto principal
        run: npm run typecheck

      - name: Pruebas del proyecto principal
        run: npm test

      - name: Pruebas de Apps Script
        run: npm run test:apps-script

      - name: Compilar el proyecto principal
        run: npm run build

  # Valida y compila web-reservas/ — solo corre si el backend pasó todas
  # sus validaciones. Usa --if-present para lint/typecheck/test porque son
  # scripts propios de este subproyecto: si alguno se quita en el futuro,
  # el workflow no debe fallar buscando un script inexistente.
  validate-and-build-frontend:
    needs: validate-backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-reservas/package-lock.json

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        working-directory: web-reservas
        run: npm ci

      - name: Lint de web-reservas
        working-directory: web-reservas
        run: npm run lint --if-present

      - name: Typecheck de web-reservas
        working-directory: web-reservas
        run: npm run typecheck --if-present

      - name: Pruebas de web-reservas
        working-directory: web-reservas
        run: npm test --if-present

      - name: Compilar la página
        working-directory: web-reservas
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE_URL: https://esquece.onrender.com
        run: npm run build

      - name: Empaquetar la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-reservas/out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build-frontend
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
